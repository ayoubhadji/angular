<h2>Ajouter une suggestion</h2>

<form [formGroup]="suggestionForm" (ngSubmit)="onSubmit()">

  <div>
    <label>Titre :</label><br>
    <input type="text" formControlName="title">
  </div>

  <div>
    <label>Description :</label><br>
    <textarea formControlName="description"></textarea>
  </div>

  <div>
    <label>Catégorie :</label><br>
    <select formControlName="category">
      <option value="">-- Sélectionnez une catégorie --</option>
      <option *ngFor="let cat of categories" [value]="cat">
        {{cat}}
      </option>
    </select>
  </div>

  <div>
    <label>Date :</label><br>
    <input type="text" formControlName="date" readonly>
  </div>

  <div>
    <label>Status :</label><br>
    <input type="text" formControlName="status" readonly>
  </div>

  <br>

  <button type="submit" [disabled]="suggestionForm.invalid">
    Soumettre
  </button>

</form>
