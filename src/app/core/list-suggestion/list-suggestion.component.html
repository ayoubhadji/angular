<h2>Liste des suggestions</h2>

<input
  type="text"
  class="form-control mb-3"
  placeholder="Rechercher par titre ou catégorie"
  [(ngModel)]="searchText"
/>

<div *ngFor="let s of filteredSuggestions()" class="card mb-3">
  <div class="card-body">
    <h5>{{ s.title }}</h5>
    <small>{{ s.category }} | {{ s.date | date:'dd MMM yyyy' }}</small>

    <p>{{ s.description }}</p>

    <span
      class="badge"
      [ngClass]="{
        'bg-success': s.status === 'acceptee',
        'bg-danger': s.status === 'refusee',
        'bg-warning': s.status === 'en_attente'
      }">
      {{ s.status }}
    </span>

    <div class="mt-3" *ngIf="s.status !== 'refusee'">
      <button class="btn btn-primary me-2" (click)="likeSuggestion(s)">
         Like {{ s.nbLikes }}
      </button>

      <button class="btn btn-outline-secondary" (click)="addToFavorites(s)">
         Ajouter aux favoris
      </button>
    </div>
  </div>
</div>
